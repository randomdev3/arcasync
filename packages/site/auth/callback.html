<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ArcaSync · Signing in</title>
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script src="/theme.js"></script>
		<script type="module" src="/src/pages/callback.ts"></script>
	</head>
	<body>
		<!--@header-->
		<main id="main" tabindex="-1">
			<div class="wrap page">
				<p class="label page__rail">ArcaSync / Sign in</p>
				<div class="flow" data-flow>
				<p class="visually-hidden" role="status" aria-live="polite" data-status></p>

				<section data-state="exchanging">
					<div class="flow-head">
						<p class="kicker">sign in</p>
						<h1>Signing you in</h1>
					</div>
					<div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
				</section>

				<section data-state="done" hidden>
					<div class="flow-head">
						<p class="kicker" data-done-kicker>signed in</p>
						<h1 class="big-who"><span class="dot" data-user-dot></span><span data-done-text>Signed in</span></h1>
					</div>
					<p class="lede">Taking you on…</p>
				</section>

				<section data-state="error" hidden>
					<div class="flow-head">
						<p class="kicker">sign in</p>
						<h1 tabindex="-1">Couldn't sign you in</h1>
					</div>
					<p class="callout callout--error" data-error></p>
					<div class="btn-row">
						<a class="btn btn--primary" href="/signin" data-retry>Try again</a>
						<a class="btn" href="/join" data-join hidden>Use your invite</a>
					</div>
				</section>
				</div>
			</div>
		</main>
		<!--@footer-->
	</body>
</html>
